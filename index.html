<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Pivot Walk Editor</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --text: #e8eaf0;
    --muted: #8a90a2;
    --btn: #2a2e3a;
    --btn-active: #3a3f4f;
    --accent: #ffd166;
    --sel: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  .view {
    display: none; flex-direction: column; align-items: center;
    height: 100%; max-width: 560px; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
  }
  .view.active { display: flex; }
  header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 0 8px; }
  #stageSelect {
    font: inherit; font-size: 17px; font-weight: 700; color: var(--text); background: var(--btn);
    border: none; border-radius: 8px; padding: 8px 10px;
  }
  #stageLabel { flex: 1; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info { font-size: 14px; color: var(--muted); white-space: nowrap; }
  #info b { color: var(--text); font-size: 20px; }
  .boardWrap { position: relative; width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #overlay {
    position: absolute; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(10, 12, 16, 0.72); border-radius: 12px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 44px; color: var(--accent); letter-spacing: 0.08em; }
  #overlay p { margin: 0; font-size: 17px; }
  #overlay .sub { color: var(--muted); font-size: 14px; }
  #chooser {
    position: absolute; display: none; flex-direction: column; gap: 6px;
    background: #0d0f14; border: 1px solid #3a3f50; border-radius: 10px; padding: 8px; z-index: 5;
  }
  #chooser.show { display: flex; }
  #chooser { flex-direction: row; }
  #chooser button.footBtn { width: 44px; height: 44px; border-radius: 50%; padding: 0; }
  .controls { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 10px; }
  button {
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--btn); border: none; border-radius: 10px;
    padding: 13px 4px; touch-action: manipulation;
  }
  button:active { background: var(--btn-active); }
  button:disabled { opacity: 0.35; }
  button.small { padding: 8px 10px; font-size: 13px; }
  button.primary { background: var(--accent); color: #222; font-weight: 700; }
  #overlay button { padding: 12px 28px; margin-top: 6px; }
  .legend { width: 100%; font-size: 12px; color: var(--muted); text-align: center; padding-top: 6px; }

  /* ---------- エディタ ---------- */
  .edRow { width: 100%; display: flex; gap: 6px; align-items: center; padding-bottom: 6px; flex-wrap: wrap; }
  .edRow input, .edRow select {
    font: inherit; font-size: 14px; color: var(--text); background: var(--btn);
    border: none; border-radius: 8px; padding: 8px; min-width: 0;
  }
  .edRow input { flex: 1; }
  .edRow select { flex: 1; }
  .sizeCtl { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .sizeCtl b { color: var(--text); min-width: 18px; text-align: center; }
  #palette {
    width: 100%; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    padding: 6px 0; max-height: 30vh; overflow-y: auto;
  }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--btn); border-radius: 8px; padding: 4px 2px; border: 2px solid transparent;
    font-size: 10px; color: var(--muted); line-height: 1.1; text-align: center;
  }
  .tool.sel { border-color: var(--sel); color: var(--text); }
  .tool canvas { width: 30px; height: 30px; }
  .edActions { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .edActions button { padding: 10px 2px; font-size: 13px; }
  #edStatus { width: 100%; font-size: 13px; color: var(--muted); min-height: 1.4em; padding: 4px 0; text-align: center; }
  #edStatus.ok { color: #8bd17c; }
  #edStatus.ng { color: #ff7b8a; }
  #modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); z-index: 20; padding: 16px;
  }
  #modal.show { display: flex; }
  #modal .box { background: var(--panel); border-radius: 12px; padding: 14px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
  #modal h3 { margin: 0; font-size: 16px; }
  #modal p { margin: 0; font-size: 12px; color: var(--muted); }
  #modal textarea {
    width: 100%; height: 42vh; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    background: #0d0f14; color: var(--text); border: 1px solid #3a3f50; border-radius: 8px; padding: 8px;
    -webkit-user-select: text; user-select: text;
  }
  #modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  #modal .btns button { padding: 10px 16px; }
</style>
</head>
<body>

<!-- ====================== プレイ画面 ====================== -->
<div id="playView" class="view active">
  <header>
    <select id="stageSelect" aria-label="ステージ"></select>
    <div id="stageLabel"></div>
    <div id="info"><b id="moveCount">0</b> 手</div>
  </header>
  <div class="boardWrap" id="boardWrap">
    <canvas id="board"></canvas>
    <div id="chooser"></div>
    <div id="overlay">
      <h2>CLEAR!</h2>
      <p id="clearMoves"></p>
      <button id="btnNextOverlay" class="primary">次のステージへ</button>
    </div>
  </div>
  <div class="controls">
    <button id="btnPrev">◀ 前</button>
    <button id="btnUndo">戻す</button>
    <button id="btnReset">リセット</button>
    <button id="btnNext">次 ▶</button>
  </div>
  <div class="controls" style="grid-template-columns: 1fr; padding-top: 6px;">
    <button id="btnToEditor" class="small">ステージエディタ</button>
  </div>
</div>

<!-- ====================== エディタ画面 ====================== -->
<div id="editView" class="view">
  <header>
    <div style="font-size:18px;font-weight:700;">ステージエディタ</div>
    <button id="btnEdToPlay" class="small">プレイに戻る</button>
  </header>
  <div class="edRow">
    <select id="edOpen"></select>
    <button id="btnEdNew" class="small">新規</button>
  </div>
  <div class="edRow">
    <input id="edName" placeholder="ステージ名" maxlength="20">
    <div class="sizeCtl">幅<button class="small" data-size="w-">−</button><b id="edW">7</b><button class="small" data-size="w+">＋</button></div>
    <div class="sizeCtl">高<button class="small" data-size="h-">−</button><b id="edH">9</b><button class="small" data-size="h+">＋</button></div>
  </div>
  <div class="boardWrap" id="edWrap">
    <canvas id="edCanvas"></canvas>
  </div>
  <div id="palette"></div>
  <div id="edStatus">マスをタップ（なぞる）して配置。ギミックは床に重ねられ、同じものをもう一度置くと外れます</div>
  <div class="edActions">
    <button id="btnEdTest" class="primary">テスト</button>
    <button id="btnEdCheck">検証</button>
    <button id="btnEdSave">保存</button>
    <button id="btnEdDelete">削除</button>
    <button id="btnEdExport">書き出し</button>

</div>

<div id="modal">
  <div class="box">
    <h3 id="modalTitle"></h3>
    <p id="modalNote"></p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="btns">
      <button id="modalCancel">閉じる</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
 * 設定
 * ========================================================= */
const CONFIG = {
  // 回転中に動く足が通過する斜めのマス C の判定（true: C が通れないと回転不可）
  CHECK_DIAGONAL_PASS: true,
  // 回転アニメーションの長さ（ミリ秒）
  ANIM_MS: 180,
  // ソルバーが調べる状態数の上限（崩れる床や塗りマスが多いと状態が増える）
  SOLVER_MAX_STATES: 400000,
  // 自作ステージの保存先（ブラウザの localStorage）
  STORAGE_KEY: 'pivotwalk.customStages.v1',
};

/* =========================================================
 * マスの定義
 * 1マス = 「地形」1つ ＋ その上に重ねる「ギミック」0個以上。
 *
 * 地形 TERRAINS（1マスに1つ）
 *   char      : ステージ文字列での文字
 *   label     : エディタでの名前
 *   standable : 足を乗せられるか
 *   passable  : 回転中に足が通過できるか（通過マス C の判定に使う）
 *               true / false、または関数 (dx, dy) => boolean
 *               (dx, dy) は「軸の足 → 通過マス C」の向き（各成分 ±1）
 *   passEdge  : 斜めの姿勢のまま90°回るとき、足がマスの「辺ぞい」をかすめて通れるか。
 *               関数 (fx, fy) => boolean。(fx, fy) はかすめる辺の向き（軸から遠い側）
 *
 * ギミック GIMMICKS（床の上に重ねられる。group が同じものは1マスに1つまで）
 *   goalFor   : そのマスをゴールとして使える足（'A' / 'B'）
 *   onEnter / onLeave : 足が乗った／離れたときの効果。
 *               (s, level, idx) を受け取り、状態 s（コピー済み）を書き換える
 * 新しいギミックはここにエントリを足し、必要なら onEnter / onLeave を書く。
 * ========================================================= */

/** 三角形の地形。埋まっている角の向き (sx, sy)。足は乗れない。
 *  回転中の足は軸の足に近い側の角をかすめるので、埋まった角が軸と反対を向くときだけ通れる。 */
function triangleTerrain(char, sx, sy, label) {
  return {
    char, label, standable: false, draw: 'triangle', solid: { x: sx, y: sy },
    passable: (dx, dy) => dx === sx && dy === sy,
    // 斜めの姿勢のまま回るときは、どの向きでも斜めの面か直角の角にぶつかるので通れない
    passEdge: () => false,
  };
}
/** 山形の三角形。底辺がマスの1辺 (ex, ey) にあり、頂点がマスの中心。足は乗れない。
 *  回転中の足は、底辺と反対側の2つの角のどちらをかすめる場合も通れる。 */
function peakTerrain(char, ex, ey, label) {
  return {
    char, label, standable: false, draw: 'peak', base: { x: ex, y: ey },
    passable: (dx, dy) => dx * ex + dy * ey > 0,
    passEdge: (fx, fy) => fx === -ex && fy === -ey,
  };
}

const TERRAINS = {
  wall:  { char: '#', label: '壁', standable: false, passable: false, passEdge: () => false, draw: 'wall' },
  floor: { char: '.', label: '床', standable: true,  passable: true,  passEdge: () => true,  draw: 'floor' },
  triTL: triangleTerrain('r', -1, -1, '三角◤'),
  triTR: triangleTerrain('7',  1, -1, '三角◥'),
  triBL: triangleTerrain('L', -1,  1, '三角◣'),
  triBR: triangleTerrain('J',  1,  1, '三角◢'),
  peakU: peakTerrain('^',  0,  1, '山 ▲'), // 底辺が下、上向き
  peakD: peakTerrain('v',  0, -1, '山 ▼'),
  peakR: peakTerrain('>', -1,  0, '山 ▶'),
  peakL: peakTerrain('<',  1,  0, '山 ◀'),
};

const GIMMICKS = {
  goal:  { char: 'G', label: 'ゴール', group: 'goal', goalFor: ['A', 'B'] },
  goalA: { char: 'R', label: 'A専用',  group: 'goal', goalFor: ['A'] },
  goalB: { char: 'U', label: 'B専用',  group: 'goal', goalFor: ['B'] },
  // 45°アイテム: 足が45°回ってこのマスに入ると取れる（消える）。取るたびに縦横⇔斜めの姿勢が切り替わる
  item: {
    char: 'O', label: '45°アイテム', group: 'item',
    onEnter(s, level, idx) { s.items = setBit(s.items, level.itemBit.get(idx)); },
  },
  // 崩れる床: 足が離れると穴になる（穴には乗れないが、回転で上を通過はできる）
  crumble: {
    char: 'C', label: '崩れる床', group: 'crumble',
    onLeave(s, level, idx) { s.broken = setBit(s.broken, level.crumbleBit.get(idx)); },
  },
  // スイッチ: 足が乗るたびにすべての扉が開閉する
  switch: { char: 'S', label: 'スイッチ', group: 'switch', onEnter(s) { s.door ^= 1; } },
  doorClosed: { char: 'D', label: '扉(閉)', group: 'door' },
  doorOpen:   { char: 'd', label: '扉(開)', group: 'door' },
  // 塗りマス: すべて踏むとクリア条件を満たす
  paint: {
    char: 'P', label: '塗りマス', group: 'paint',
    onEnter(s, level, idx) { s.painted = setBit(s.painted, level.paintBit.get(idx)); },
  },
};
// 足が乗った／離れたときに効果を処理する順番
const GIMMICK_ORDER = ['item', 'paint', 'switch', 'crumble', 'goal', 'goalA', 'goalB', 'doorClosed', 'doorOpen'];

const CHAR_TO_TERRAIN = {}, CHAR_TO_GIMMICK = {};
for (const [k, t] of Object.entries(TERRAINS)) CHAR_TO_TERRAIN[t.char] = k;
for (const [k, g] of Object.entries(GIMMICKS)) CHAR_TO_GIMMICK[g.char] = k;

function setBit(str, i) { return str.slice(0, i) + '1' + str.slice(i + 1); }

/**
 * マップの1行を、マスごとの記述に分ける。
 * 1文字 = 1マス。[ ] でくくると1マスに複数書ける（例: [CG] = 崩れる床＋ゴール、[AP] = 足Aの初期位置＋塗りマス、[7] でも可）。
 * 戻り値: [{ terrain, mods: [ギミックキー...], a: bool, b: bool }]
 */
function tokenizeRow(row, y) {
  const cells = [];
  for (let i = 0; i < row.length; i++) {
    let chars;
    if (row[i] === '[') {
      const j = row.indexOf(']', i);
      if (j < 0) throw new Error(`${y + 1}行目: ] がありません`);
      chars = row.slice(i + 1, j);
      i = j;
    } else chars = row[i];
    const cell = { terrain: null, mods: [], a: false, b: false };
    for (const ch of chars) {
      if (ch === 'A') cell.a = true;
      else if (ch === 'B') cell.b = true;
      else if (CHAR_TO_TERRAIN[ch]) {
        if (cell.terrain) throw new Error(`${y + 1}行目: 1マスに地形が2つあります`);
        cell.terrain = CHAR_TO_TERRAIN[ch];
      } else if (CHAR_TO_GIMMICK[ch]) {
        const k = CHAR_TO_GIMMICK[ch];
        if (cell.mods.some(m => GIMMICKS[m].group === GIMMICKS[k].group)) throw new Error(`${y + 1}行目: 同じ種類のギミックが重なっています`);
        cell.mods.push(k);
      } else throw new Error(`未知のマス文字 "${ch}"（${y + 1}行目）`);
    }
    if (!cell.terrain) cell.terrain = 'floor';
    if (cell.terrain !== 'floor' && (cell.mods.length || cell.a || cell.b)) throw new Error(`${y + 1}行目: ギミックや足は床の上にしか置けません`);
    if (cell.a && cell.b) throw new Error(`${y + 1}行目: A と B が同じマスにあります`);
    cells.push(cell);
  }
  return cells;
}
/** 1マス分の記述を文字列に戻す */
function cellToText(cell) {
  let t = (cell.a ? 'A' : '') + (cell.b ? 'B' : '') + cell.mods.map(m => GIMMICKS[m].char).join('');
  if (cell.terrain !== 'floor') t = TERRAINS[cell.terrain].char + t;
  if (t === '') return '.';
  return t.length === 1 ? t : `[${t}]`;
}

/* =========================================================
 * ステージデータ
 * 1文字 = 1マス。[ ] でくくると1マスにギミックを重ねられる（例: [CG] 崩れる床＋ゴール、[SP] スイッチ＋塗り）
 * 地形:
 *   #: 壁  .: 床
 * ギミック（床の上に置く。重ねられる）:
 *   A/B: 足の初期位置
 *   G: ゴール（どちらの足でも可。G があるときは両足とも G に乗る）
 *   R: 足A専用ゴール（R だけなら「足Aが R に乗ればクリア」）  U: 足B専用ゴール
 * （以下、三角形と山形は地形）
 *   三角形（足は乗れない。埋まっている角の向きで通過の可否が変わる）
 *     r: ◤ 左上   7: ◥ 右上   L: ◣ 左下   J: ◢ 右下
 *   山形の三角形（足は乗れない。頂点側の2つの角のどちらからでもかすめて通れる）
 *     ^: ▲   v: ▼   >: ▶   <: ◀
 *   O: 45°アイテム（45°回ってこのマスに入ると取れて斜めの姿勢になる。斜めの間は斜めのまま90°ずつ回る。
 *      縦横に戻るには、もう一度アイテムを取る必要がある）
 *   C: 崩れる床（足が離れると穴になる。穴の上は回転で通過はできる）
 *   S: スイッチ（足が乗るたびに扉が開閉）  D: 扉（最初は閉）  d: 扉（最初は開）
 *   P: 塗りマス（すべてのPを踏むとクリア条件を満たす。G/R/U と組み合わせると両方必要）
 * ========================================================= */
const STAGES = [
  { name: '三角の坂', map: [
    '########',
    '#AB7####',
    '#L..7###',
    '##L..7##',
    '###L..7#',
    '####LR.#',
    '########',
  ]},
  { name: '小部屋', map: [
    '########',
    '####..##',
    '####..7#',
    '###r..R#',
    '##r....#',
    '#r....J#',
    '#.....##',
    '#L..7###',
    '#AB...##',
    '#L....##',
    '########',
  ]},
  { name: '回り道', map: [
    '#########',
    '#####r.R#',
    '#r.7r...#',
    '#......J#',
    '#....J###',
    '#r..J####',
    '#...#####',
    '#..7#####',
    '#LAB#####',
    '##.J#####',
    '#########',
  ]},
  { name: '長い下り坂', map: [
    '#########',
    '#A7######',
    '#B.7#####',
    '#...7####',
    '##L...###',
    '###...7##',
    '####L...#',
    '#####L..#',
    '#####r..#',
    '####r...#',
    '####GGJ##',
    '#########',
  ]},
  { name: '広場の先', map: [
    '#########',
    '####.R###',
    '##.7..7##',
    '#r.....##',
    '#.....J##',
    '#L...7###',
    '###L...##',
    '####L..7#',
    '#####...#',
    '#####r..#',
    '#####.AB#',
    '#####L.J#',
    '#########',
  ]},
  { name: '近くて遠い', map: [
    '#########',
    '####r.###',
    '###r..7##',
    '##r....7#',
    '#r...L..#',
    '#...Rr..#',
    '#L..r..J#',
    '###r..J##',
    '##r..J###',
    '##A.J####',
    '##BJ#####',
    '#########',
  ]},
  { name: '折り返し', map: [
    '#########',
    '###...7##',
    '##r....7#',
    '#rABJL..#',
    '#...#r..#',
    '#.J#r..J#',
    '###r..J##',
    '##r..J###',
    '#r..J####',
    '#...#####',
    '#RJ######',
    '#########',
  ]},
  { name: 'すぐ隣のゴール', map: [
    '#########',
    '#####rAB#',
    '####r..J#',
    '###r..J##',
    '##...J###',
    '#r..J#rG#',
    '#..J#r.G#',
    '#..7r..J#',
    '#L....J##',
    '##L...###',
    '###L.J###',
    '#########',
  ]},
  // ---- ここから新ギミックのお試しステージ ----
  { name: '山を越える', map: [
    '#######',
    '#.r.7.#',
    '#r...7#',
    '#AB^.R#',
    '####..#',
    '#######',
  ]},
  { name: '山形の道', map: [
    '######',
    '#A..v#',
    '#B...#',
    '###..#',
    '#G...#',
    '#G...#',
    '######',
  ]},

/* =========================================================
 * ステージの読み込み
 * ========================================================= */
function tokenizeStage(rows) {
  if (!rows || !rows.length) throw new Error('マップが空です');
  const grid = rows.map((r, y) => tokenizeRow(r, y));
  const w = Math.max(...grid.map(r => r.length));
  for (const r of grid) while (r.length < w) r.push({ terrain: 'wall', mods: [], a: false, b: false });
  return { grid, w, h: grid.length };
}

function parseStage(stage) {
  const { grid, w, h } = tokenizeStage(stage.map);
  let a = null, b = null;
  const crumbleBit = new Map(), paintBit = new Map(), itemBit = new Map();
  const goals = { A: { own: false, shared: false }, B: { own: false, shared: false } };
  const cells = [];
  for (let y = 0; y < h; y++) {
    const line = [];
    for (let x = 0; x < w; x++) {
      const t = grid[y][x];
      if (t.a) { if (a) throw new Error('A が2つあります'); a = { x, y }; }
      if (t.b) { if (b) throw new Error('B が2つあります'); b = { x, y }; }
      const idx = y * w + x;
      const cell = { terrain: t.terrain, mods: t.mods.slice().sort((p, q) => GIMMICK_ORDER.indexOf(p) - GIMMICK_ORDER.indexOf(q)), goal: null, door: null };
      for (const m of cell.mods) {
        if (m === 'crumble') crumbleBit.set(idx, crumbleBit.size);
        if (m === 'paint') paintBit.set(idx, paintBit.size);
        if (m === 'item') itemBit.set(idx, itemBit.size);
        if (GIMMICKS[m].group === 'goal') {
          cell.goal = m;
          const gf = GIMMICKS[m].goalFor;
          if (gf.length === 2) goals.A.shared = goals.B.shared = true; else goals[gf[0]].own = true;
        }
        if (GIMMICKS[m].group === 'door') cell.door = m;
      }
      line.push(cell);
    }
    cells.push(line);
  }
  if (!a || !b) throw new Error('A と B の初期位置が必要です');
  if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) throw new Error('A と B は上下左右に隣接している必要があります');
  const hasFootGoal = goals.A.own || goals.A.shared || goals.B.own || goals.B.shared;
  if (!hasFootGoal && paintBit.size === 0) throw new Error('ゴール（G / R / U / P）がありません');
  const level = { w, h, cells, start: null, goals, hasFootGoal, crumbleBit, paintBit, itemBit };
  // 初期状態（最初に乗っているマスの塗りは反映する）
  const s0 = { a, b, door: 0, broken: '0'.repeat(crumbleBit.size), painted: '0'.repeat(paintBit.size), items: '0'.repeat(itemBit.size) };
  for (const p of [a, b]) {
    const idx = p.y * w + p.x;
    if (paintBit.has(idx)) s0.painted = setBit(s0.painted, paintBit.get(idx));
  }
  level.start = s0;
  if (!canStand(level, s0, a.x, a.y) || !canStand(level, s0, b.x, b.y)) throw new Error('足の初期位置に乗れません');
  return level;
}

/* =========================================================
 * ルール（盤面とは独立した純粋関数。ソルバーとゲームで共用）
 * 状態 s = { a:{x,y}, b:{x,y}, door:0|1, broken:'0101', painted:'0011', items:'01' }
 * ========================================================= */
function cellAt(level, x, y) {
  if (x < 0 || y < 0 || x >= level.w || y >= level.h) return null;
  return level.cells[y][x];
}
/** 状態を反映したマスの様子 */
function cellView(level, s, x, y) {
  const c = cellAt(level, x, y);
  if (!c) return null;
  const idx = y * level.w + x;
  const has = m => c.mods.includes(m);
  const broken = has('crumble') && s.broken[level.crumbleBit.get(idx)] === '1';
  const doorOpen = c.door ? ((c.door === 'doorOpen') !== (s.door === 1)) : true;
  return {
    terrain: c.terrain, cell: c, idx,
    crumble: has('crumble'), broken,
    door: c.door, doorClosed: !!c.door && !doorOpen,
    item: has('item') && s.items[level.itemBit.get(idx)] !== '1',
    paint: has('paint'), painted: has('paint') && s.painted[level.paintBit.get(idx)] === '1',
    switch: has('switch'), goal: c.goal,
  };
}
function canStand(level, s, x, y) {
  const v = cellView(level, s, x, y);
  return !!v && TERRAINS[v.terrain].standable && !v.broken && !v.doorClosed;
}
function canPass(level, s, x, y, dx, dy) {
  const v = cellView(level, s, x, y);
  if (!v || v.doorClosed) return false;
  const p = TERRAINS[v.terrain].passable;
  return typeof p === 'function' ? p(dx, dy) : p;
}
/** まだ取られていない45°アイテムがあるか */
function isItem(level, s, x, y) { const v = cellView(level, s, x, y); return !!v && v.item && canStand(level, s, x, y); }
/** 斜めの姿勢で90°回るとき、途中のマスの辺ぞい（向き fx, fy）を通れるか */
function canPassEdge(level, s, x, y, fx, fy) {
  const v = cellView(level, s, x, y);
  if (!v || v.doorClosed) return false;
  return TERRAINS[v.terrain].passEdge(fx, fy);
}

function cloneState(s) {
  return { a: { ...s.a }, b: { ...s.b }, door: s.door, broken: s.broken, painted: s.painted, items: s.items };
}
function stateKey(s) {
  return `${s.a.x},${s.a.y}|${s.b.x},${s.b.y}|${s.door}|${s.broken}|${s.painted}|${s.items}`;
}

/** 動かした結果の状態を返す（マスの効果を反映）。成立しなければ null */
function applyMove(level, s, mv) {
  const ns = cloneState(s);
  const from = s[mv.mover];
  ns[mv.mover] = { ...mv.to };
  const fromCell = cellAt(level, from.x, from.y);
  for (const m of fromCell.mods) if (GIMMICKS[m].onLeave) GIMMICKS[m].onLeave(ns, level, from.y * level.w + from.x);
  const v = cellView(level, s, mv.to.x, mv.to.y);
  for (const m of v.cell.mods) {
    if (m === 'item' && !v.item) continue; // 取られたアイテムは何もしない
    if (GIMMICKS[m].onEnter) GIMMICKS[m].onEnter(ns, level, v.idx);
  }
  // 効果のあと（扉が閉じた等）でも両足が立てること
  if (!canStand(level, ns, ns.a.x, ns.a.y) || !canStand(level, ns, ns.b.x, ns.b.y)) return null;
  if (ns.a.x === ns.b.x && ns.a.y === ns.b.y) return null;
  return ns;
}

/**
 * 1手で可能な移動をすべて列挙する。
 * 戻り値: [{ pivot, mover, to, dir(+1 時計回り / -1 反時計回り), angle(π/2 か π/4), kind, next }]
 *   kind: 'turn90' 通常の90°回転 / 'stop45' 45°回ってアイテムを取り斜めになる
 *         / 'turn45' 斜めの姿勢から45°回ってアイテムを取り縦横に戻る / 'turnDiag' 斜めの姿勢のまま90°回る
 * アイテムのマスには45°回って入るときだけ入れる（90°回転では入れない）。
 */
function getMoves(level, s) {
  const result = [];
  const seen = new Set();
  const push = (mv) => {
    const next = applyMove(level, s, mv);
    if (!next) return;
    const k = stateKey(next);
    if (seen.has(k)) return;
    seen.add(k);
    mv.next = next;
    result.push(mv);
  };
  for (const pivot of ['a', 'b']) {
    const mover = pivot === 'a' ? 'b' : 'a';
    const p = s[pivot], m = s[mover];
    const vx = m.x - p.x, vy = m.y - p.y;
    if (Math.abs(vx) + Math.abs(vy) === 1) {
      // 縦か横の姿勢
      for (const dir of [1, -1]) {
        const nx = dir === 1 ? -vy : vy, ny = dir === 1 ? vx : -vx;
        const to = { x: p.x + nx, y: p.y + ny };
        const pass = { x: m.x + nx, y: m.y + ny };
        // 90°回転
        if (canStand(level, s, to.x, to.y) && !isItem(level, s, to.x, to.y)
            && (!CONFIG.CHECK_DIAGONAL_PASS || canPass(level, s, pass.x, pass.y, pass.x - p.x, pass.y - p.y))) {
          push({ pivot, mover, to, dir, angle: Math.PI / 2, kind: 'turn90' });
        }
        // 45°回ってアイテムを取る → 斜めの姿勢になる
        if (isItem(level, s, pass.x, pass.y)) {
          push({ pivot, mover, to: pass, dir, angle: Math.PI / 4, kind: 'stop45' });
        }
      }
    } else if (Math.abs(vx) === 1 && Math.abs(vy) === 1) {
      // 斜めの姿勢: 45°回ってアイテムを取ると縦か横に戻る
      for (const to of [{ x: p.x + vx, y: p.y }, { x: p.x, y: p.y + vy }]) {
        if (!isItem(level, s, to.x, to.y)) continue;
        const cross = vx * (to.y - p.y) - vy * (to.x - p.x);
        push({ pivot, mover, to, dir: cross > 0 ? 1 : -1, angle: Math.PI / 4, kind: 'turn45' });
      }
      // 斜めの姿勢のまま90°回って、別の斜めの位置へ
      for (const dir of [1, -1]) {
        const nx = dir === 1 ? -vy : vy, ny = dir === 1 ? vx : -vx;
        const to = { x: p.x + nx, y: p.y + ny };
        // 途中で通るのは、軸の上下左右のうち元の位置と行き先にはさまれたマス。足はその遠い側の辺ぞいを通る
        const mid = { x: p.x + (vx + nx) / 2, y: p.y + (vy + ny) / 2 };
        const fx = mid.x - p.x, fy = mid.y - p.y;
        if (canStand(level, s, to.x, to.y) && !isItem(level, s, to.x, to.y)
            && (!CONFIG.CHECK_DIAGONAL_PASS || canPassEdge(level, s, mid.x, mid.y, fx, fy))) {
          push({ pivot, mover, to, dir, angle: Math.PI / 2, kind: 'turnDiag' });
        }
      }
    }
  }
  return result;
}

/**
 * ゴール判定。ゴールの種類を増やすときはここを拡張する。
 * 足ごとの条件: 専用ゴール（AならR、BならU）があればそこ、なければ G があれば G、どちらもなければどこでもよい。
 * 塗りマス P があれば、すべて塗られていることも必要。
 */
function isGoal(level, s) {
  if (s.painted.includes('0')) return false;
  if (!level.hasFootGoal) return true;
  return footOk(level, 'A', s.a) && footOk(level, 'B', s.b);
}
function footOk(level, foot, pos) {
  const c = cellAt(level, pos.x, pos.y);
  const gf = c.goal ? GIMMICKS[c.goal].goalFor : [];
  const g = level.goals[foot];
  if (g.own) return gf.length === 1 && gf[0] === foot;
  if (g.shared) return gf.length === 2;
  return true;
}

/* =========================================================
 * 検証用ソルバー（幅優先探索）
 * 戻り値: {
 *   moves : 最短手数（解けなければ -1）
 *   count : 最短手順の数
 *   routes: 最短ルートの数（同じ2×2の中を右回り／左回りするだけの違いは同じとみなす）
 *   path  : 最短手順の一例 [move...]
 *   truncated: 状態数の上限で探索を打ち切ったか
 * }
 * ========================================================= */
function solve(level, routeLimit = 5000) {
  const start = level.start;
  const startKey = stateKey(start);
  const info = new Map([[startKey, { dist: 0, count: 1, preds: [], move: null, state: start }]]);
  let frontier = [start];
  const goals = [];
  let truncated = false;
  while (frontier.length && !goals.length) {
    const next = [];
    for (const s of frontier) {
      const k = stateKey(s);
      const cur = info.get(k);
      if (isGoal(level, s)) { goals.push(k); continue; }
      for (const mv of getMoves(level, s)) {
        const nk = stateKey(mv.next);
        const ex = info.get(nk);
        if (!ex) {
          if (info.size >= CONFIG.SOLVER_MAX_STATES) { truncated = true; continue; }
          info.set(nk, { dist: cur.dist + 1, count: cur.count, preds: [k], move: mv, state: mv.next });
          next.push(mv.next);
        } else if (ex.dist === cur.dist + 1) {
          ex.count += cur.count;
          ex.preds.push(k);
        }
      }
    }
    frontier = next;
  }
  if (!goals.length) return { moves: -1, count: 0, routes: 0, path: [], truncated, states: info.size };

  const path = [];
  for (let k = goals[0]; info.get(k).preds.length; k = info.get(k).preds[0]) path.unshift(info.get(k).move);
  const count = goals.reduce((n, k) => n + info.get(k).count, 0);

  // ルート数: 最短手順を列挙し、「2手で同じ2×2の向かい合う辺へ移る」途中の状態を同一視して数える
  const cellsOf = k => { const s = info.get(k).state; return [s.a, s.b]; };
  const isDetour = (k1, k3) => {
    const c = [...cellsOf(k1), ...cellsOf(k3)];
    if (new Set(c.map(p => p.x + ',' + p.y)).size !== 4) return false;
    const xs = c.map(p => p.x), ys = c.map(p => p.y);
    return Math.max(...xs) - Math.min(...xs) === 1 && Math.max(...ys) - Math.min(...ys) === 1;
  };
  const sigs = new Set();
  let enumerated = 0;
  const stack = [];
  const walk = k => {
    if (enumerated > routeLimit) return;
    stack.push(k);
    if (k === startKey) {
      enumerated++;
      const p = stack.slice().reverse();
      sigs.add(p.map((v, i) => (i > 0 && i < p.length - 1 && isDetour(p[i - 1], p[i + 1])) ? '*' : v).join(' '));
    } else {
      for (const pk of info.get(k).preds) walk(pk);
    }
    stack.pop();
  };
  for (const g of goals) walk(g);
  const routes = enumerated > routeLimit ? Infinity : sigs.size;
  return { moves: info.get(goals[0]).dist, count, routes, path, truncated, states: info.size };
}

function describeSolve(r) {
  if (r.moves < 0) return r.truncated ? '探索の上限に達しました（解けるか不明）' : '解けません';
  const routes = r.routes === Infinity ? '多数' : `${r.routes}通り`;
  return `最短${r.moves}手 / 最短ルート${routes}`;
}

/* =========================================================
 * 自作ステージの保存
 * ========================================================= */
function loadCustomStages() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list.filter(s => s && Array.isArray(s.map)) : [];
  } catch (e) { return []; }
}
function saveCustomStages(list) {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}
let customStages = loadCustomStages();
function allStages() {
  return [...STAGES.map(s => ({ ...s, custom: false })), ...customStages.map((s, i) => ({ ...s, custom: true, customIndex: i }))];
}

/* =========================================================
 * 描画（プレイとエディタで共用）
 * ========================================================= */
const COLORS = {
  floor: '#262a35',
  floorLine: '#323745',
  block: '#3a3f50',
  slopeEdge: '#5b6278',
  goal: '#ffd166',
  footA: '#ef476f',
  footB: '#3a86ff',
  stop: '#2ec4b6',
  switchCol: '#b388ff',
  paint: '#8bd17c',
  crumble: '#5a4a3a',
  leg: 'rgba(230, 232, 240, 0.55)',
  hint: 'rgba(255, 255, 255, 0.13)',
};

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/** 地形とギミックの一覧から、描画用のマスの様子を作る（エディタ・パレット用。状態は初期状態） */
function staticView(terrain, mods = []) {
  const has = m => mods.includes(m);
  const door = mods.find(m => GIMMICKS[m].group === 'door') || null;
  return {
    terrain, crumble: has('crumble'), broken: false, door, doorClosed: door === 'doorClosed',
    item: has('item'), paint: has('paint'), painted: false, switch: has('switch'),
    goal: mods.find(m => GIMMICKS[m].group === 'goal') || null,
  };
}

/**
 * 1マスを描く（地形 → ギミックの順に重ねる）。
 * v: cellView / staticView の結果  px,py: 左上座標  c: マスの大きさ
 * opt: { wallMode:'auto'|'always', near:bool }
 */
function drawCell(g, v, px, py, c, opt = {}) {
  const ter = TERRAINS[v.terrain];
  if (ter.draw === 'wall') {
    if (opt.near || opt.wallMode === 'always') {
      g.fillStyle = COLORS.block;
      g.fillRect(px, py, c, c);
    }
    return;
  }
  // 床
  if (v.broken) {
    g.fillStyle = '#0b0c10';
    g.fillRect(px, py, c, c);
    g.strokeStyle = '#2a2e3a';
    g.setLineDash([c * 0.12, c * 0.1]);
    g.lineWidth = 1;
    g.strokeRect(px + 2.5, py + 2.5, c - 5, c - 5);
    g.setLineDash([]);
  } else {
    g.fillStyle = v.crumble ? COLORS.crumble : COLORS.floor;
    g.fillRect(px, py, c, c);
    g.strokeStyle = COLORS.floorLine;
    g.lineWidth = 1;
    g.strokeRect(px + 0.5, py + 0.5, c - 1, c - 1);
  }
  if (ter.draw === 'triangle') {
    const sx = ter.solid.x, sy = ter.solid.y;
    const cx = sx > 0 ? px + c : px, cy = sy > 0 ? py + c : py;
    g.fillStyle = COLORS.block;
    g.beginPath();
    g.moveTo(cx, cy); g.lineTo(sx > 0 ? px : px + c, cy); g.lineTo(cx, sy > 0 ? py : py + c);
    g.closePath(); g.fill();
    g.strokeStyle = COLORS.slopeEdge;
    g.lineWidth = Math.max(1.5, c * 0.04);
    g.beginPath(); g.moveTo(sx > 0 ? px : px + c, cy); g.lineTo(cx, sy > 0 ? py : py + c); g.stroke();
    return;
  }
  if (ter.draw === 'peak') {
    // 山形の三角形（底辺 = マスの1辺、頂点 = マスの中心）
    const { x: ex, y: ey } = ter.base;
    const mx = px + c / 2, my = py + c / 2;
    const tx = -ey, ty = ex;
    const bx = mx + ex * c / 2, by = my + ey * c / 2;
    const p1 = [bx + tx * c / 2, by + ty * c / 2], p2 = [bx - tx * c / 2, by - ty * c / 2];
    g.fillStyle = COLORS.block;
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.lineTo(mx, my); g.closePath(); g.fill();
    g.strokeStyle = COLORS.slopeEdge;
    g.lineWidth = Math.max(1.5, c * 0.04);
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(mx, my); g.lineTo(p2[0], p2[1]); g.stroke();
    return;
  }
  // ---- ギミック（重ねて描く） ----
  if (v.crumble && !v.broken) {
    g.strokeStyle = 'rgba(0,0,0,0.45)';
    g.lineWidth = Math.max(1, c * 0.035);
    g.beginPath();
    g.moveTo(px + c * 0.2, py + c * 0.25); g.lineTo(px + c * 0.45, py + c * 0.45);
    g.lineTo(px + c * 0.4, py + c * 0.7); g.moveTo(px + c * 0.45, py + c * 0.45);
    g.lineTo(px + c * 0.78, py + c * 0.4); g.moveTo(px + c * 0.6, py + c * 0.8);
    g.lineTo(px + c * 0.7, py + c * 0.6);
    g.stroke();
  }
  if (v.paint) {
    g.save();
    if (v.painted) {
      g.fillStyle = COLORS.paint;
      g.globalAlpha = 0.45;
      g.fillRect(px + 2, py + 2, c - 4, c - 4);
    } else {
      g.strokeStyle = COLORS.paint;
      g.lineWidth = Math.max(1.5, c * 0.04);
      g.setLineDash([c * 0.08, c * 0.08]);
      g.strokeRect(px + c * 0.07, py + c * 0.07, c * 0.86, c * 0.86);
    }
    g.restore();
  }
  if (v.goal) {
    const m = c * 0.16;
    const col = v.goal === 'goal' ? COLORS.goal : v.goal === 'goalA' ? COLORS.footA : COLORS.footB;
    g.save();
    g.globalAlpha = 0.18;
    g.fillStyle = col;
    roundRect(g, px + m, py + m, c - 2 * m, c - 2 * m, c * 0.12);
    g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = col;
    g.lineWidth = Math.max(2, c * 0.06);
    roundRect(g, px + m, py + m, c - 2 * m, c - 2 * m, c * 0.12);
    g.stroke();
    g.restore();
  }
  if (v.switch) {
    g.save();
    g.fillStyle = COLORS.switchCol;
    g.globalAlpha = 0.85;
    g.beginPath(); g.arc(px + c / 2, py + c / 2, c * 0.2, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = COLORS.switchCol;
    g.lineWidth = Math.max(1.5, c * 0.04);
    g.beginPath(); g.arc(px + c / 2, py + c / 2, c * 0.29, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  if (v.item) {
    // 宝石のようなひし形
    const r = c * 0.22, cx = px + c / 2, cy = py + c / 2;
    g.fillStyle = COLORS.stop;
    g.beginPath();
    g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath();
    g.moveTo(cx, cy - r); g.lineTo(cx + r * 0.45, cy - r * 0.15); g.lineTo(cx - r * 0.45, cy - r * 0.15);
    g.closePath(); g.fill();
  }
  if (v.door) {
    g.save();
    if (v.doorClosed) {
      g.globalAlpha = 0.85;
      g.fillStyle = COLORS.block;
      g.fillRect(px, py, c, c);
      g.globalAlpha = 1;
      g.strokeStyle = COLORS.switchCol;
      g.lineWidth = Math.max(2, c * 0.07);
      for (let i = 1; i <= 3; i++) {
        const x = px + c * i / 4;
        g.beginPath(); g.moveTo(x, py + c * 0.12); g.lineTo(x, py + c * 0.88); g.stroke();
      }
    } else {
      g.strokeStyle = COLORS.switchCol;
      g.lineWidth = Math.max(1.5, c * 0.05);
      g.setLineDash([c * 0.1, c * 0.08]);
      g.strokeRect(px + c * 0.12, py + c * 0.12, c * 0.76, c * 0.76);
    }
    g.restore();
  }
}

function drawFoot(g, x, y, c, color, alpha = 1) {
  const r = c * 0.33;
  g.save();
  g.globalAlpha = alpha;
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = c * 0.12;
  g.fillStyle = color;
  g.beginPath();
  g.arc(x, y, r, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function fitCanvas(cv, wrap, w, h) {
  const dpr = window.devicePixelRatio || 1;
  const cell = Math.max(8, Math.floor(Math.min(wrap.clientWidth / w, wrap.clientHeight / h)));
  const cw = cell * w, ch = cell * h;
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { cell, w: cw, h: ch, g };
}

/* =========================================================
 * プレイ画面
 * ========================================================= */
const el = id => document.getElementById(id);
const canvas = el('board');
const boardWrap = el('boardWrap');
const overlay = el('overlay');
const chooser = el('chooser');

const game = {
  stages: [],
  stageIndex: 0,
  level: null,
  state: null,
  history: [],
  moves: 0,
  cleared: false,
  anim: null,          // { move, from, start }
  layout: { cell: 40, w: 0, h: 0, g: null },
  par: [],
  testing: null,       // エディタからのテストプレイ中ならそのステージ
};

function loadStage(index) {
  game.testing = null;
  game.stages = allStages();
  game.stageIndex = (index + game.stages.length) % game.stages.length;
  startLevel(game.stages[game.stageIndex]);
}

function startLevel(stage) {
  try {
    game.level = parseStage(stage);
  } catch (e) {
    alert('ステージを読み込めません: ' + e.message);
    return;
  }
  game.state = cloneState(game.level.start);
  game.history = [];
  game.moves = 0;
  game.cleared = false;
  game.anim = null;
  overlay.classList.remove('show');
  hideChooser();
  resize();
  updateHud();
}

function updateHud() {
  // ステージ名や最短手数はヒントになるので表示しない
  const sel = el('stageSelect');
  sel.style.display = game.testing ? 'none' : '';
  el('stageLabel').textContent = game.testing ? 'テストプレイ' : '';
  if (!game.testing) {
    if (sel.options.length !== game.stages.length) {
      sel.innerHTML = '';
      game.stages.forEach((st, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${st.custom ? '★' : 'STAGE '}${i + 1}`;
        sel.appendChild(o);
      });
    }
    sel.value = game.stageIndex;
  }
  el('moveCount').textContent = game.moves;
  el('btnUndo').disabled = game.history.length === 0 || game.cleared;
  el('btnReset').disabled = game.history.length === 0 && !game.cleared;
  el('btnPrev').textContent = game.testing ? 'エディタへ' : '◀ 前';
  el('btnNext').style.visibility = game.testing ? 'hidden' : 'visible';
  el('btnToEditor').textContent = game.testing ? 'エディタに戻る' : 'ステージエディタ';
}

function tryMove(move) {
  if (game.anim || game.cleared) return;
  hideChooser();
  game.history.push(game.state);
  const from = game.state;
  game.state = move.next;
  game.moves++;
  game.anim = { move, from, start: performance.now() };
  updateHud();
  requestAnimationFrame(frame);
}

function onAnimEnd() {
  game.anim = null;
  if (isGoal(game.level, game.state)) {
    game.cleared = true;
    el('clearMoves').textContent = `${game.moves} 手`;
    el('btnNextOverlay').textContent = game.testing ? 'エディタへ戻る' : '次へ';
    overlay.classList.add('show');
    updateHud();
  }
}

function undo() {
  if (game.anim || game.cleared || !game.history.length) return;
  hideChooser();
  game.state = game.history.pop();
  game.moves--;
  updateHud();
  draw();
}

function resize() {
  if (!game.level || !el('playView').classList.contains('active')) return;
  game.layout = fitCanvas(canvas, boardWrap, game.level.w, game.level.h);
  overlay.style.width = game.layout.w + 'px';
  overlay.style.height = game.layout.h + 'px';
  draw();
}

function cellCenter(x, y) {
  const c = game.layout.cell;
  return { x: (x + 0.5) * c, y: (y + 0.5) * c };
}

function isNearOpen(level, x, y) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const c = cellAt(level, x + dx, y + dy);
    if (c && c.terrain !== 'wall') return true;
  }
  return false;
}

function groupMovesByCell(moves) {
  const map = new Map();
  for (const mv of moves) {
    const k = mv.to.x + ',' + mv.to.y;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(mv);
  }
  return map;
}

function draw(now) {
  const { level, layout } = game;
  if (!level || !layout.g) return false;
  const g = layout.g, c = layout.cell;
  const s = game.state;
  g.clearRect(0, 0, layout.w, layout.h);

  for (let y = 0; y < level.h; y++) for (let x = 0; x < level.w; x++) {
    const v = cellView(level, s, x, y);
    drawCell(g, v, x * c, y * c, c, { near: v.terrain === 'wall' && isNearOpen(level, x, y) });
  }

  // 足の位置（アニメーション中は動く足を弧に沿って補間）
  let posA = cellCenter(s.a.x, s.a.y);
  let posB = cellCenter(s.b.x, s.b.y);
  let animating = false;
  if (game.anim) {
    const t = Math.min(1, ((now || performance.now()) - game.anim.start) / CONFIG.ANIM_MS);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
    const { move, from } = game.anim;
    const p = cellCenter(from[move.pivot].x, from[move.pivot].y);
    const m0 = cellCenter(from[move.mover].x, from[move.mover].y);
    const m1 = cellCenter(move.to.x, move.to.y);
    const a0 = Math.atan2(m0.y - p.y, m0.x - p.x);
    const r0 = Math.hypot(m0.x - p.x, m0.y - p.y), r1 = Math.hypot(m1.x - p.x, m1.y - p.y);
    const ang = a0 + move.dir * move.angle * e;
    const rad = r0 + (r1 - r0) * e;
    const mp = { x: p.x + Math.cos(ang) * rad, y: p.y + Math.sin(ang) * rad };
    if (move.mover === 'a') posA = mp; else posB = mp;
    animating = t < 1;
  }

  // 移動候補のハイライト（リングの色 = 動く足）
  if (!game.anim && !game.cleared) {
    for (const [, group] of groupMovesByCell(getMoves(level, s))) {
      const to = group[0].to;
      const cc = cellCenter(to.x, to.y);
      g.fillStyle = COLORS.hint;
      roundRect(g, to.x * c + 3, to.y * c + 3, c - 6, c - 6, c * 0.14);
      g.fill();
      group.forEach((mv, i) => {
        g.strokeStyle = mv.mover === 'a' ? 'rgba(239,71,111,0.75)' : 'rgba(58,134,255,0.75)';
        g.lineWidth = 2;
        const r = c * (0.14 + i * 0.08);
        g.beginPath();
        g.arc(cc.x, cc.y, r, 0, Math.PI * 2);
        g.stroke();
      });
    }
  }

  // 両足をつなぐ脚
  g.strokeStyle = COLORS.leg;
  g.lineWidth = c * 0.14;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(posA.x, posA.y);
  g.lineTo(posB.x, posB.y);
  g.stroke();

  drawFoot(g, posA.x, posA.y, c, COLORS.footA);
  drawFoot(g, posB.x, posB.y, c, COLORS.footB);
  return animating;
}

function frame(now) {
  const still = draw(now);
  if (still) requestAnimationFrame(frame);
  else if (game.anim) { onAnimEnd(); draw(); }
}

/* ---------- 同じマスに2通りの手があるときの選択 ---------- */
function hideChooser() { chooser.classList.remove('show'); chooser.innerHTML = ''; }
function showChooser(group, x, y) {
  chooser.innerHTML = '';
  for (const mv of group) {
    const b = document.createElement('button');
    b.className = 'footBtn';
    b.style.background = mv.mover === 'a' ? COLORS.footA : COLORS.footB;
    b.addEventListener('click', e => { e.stopPropagation(); tryMove(mv); });
    chooser.appendChild(b);
  }
  const rect = canvas.getBoundingClientRect(), wrap = boardWrap.getBoundingClientRect();
  const c = game.layout.cell;
  chooser.classList.add('show');
  let left = rect.left - wrap.left + (x + 1) * c;
  let top = rect.top - wrap.top + y * c;
  left = Math.min(left, wrap.width - chooser.offsetWidth - 4);
  top = Math.min(top, wrap.height - chooser.offsetHeight - 4);
  chooser.style.left = Math.max(4, left) + 'px';
  chooser.style.top = Math.max(4, top) + 'px';
}

canvas.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  if (game.anim || game.cleared) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) / game.layout.cell);
  const y = Math.floor((ev.clientY - rect.top) / game.layout.cell);
  const group = getMoves(game.level, game.state).filter(m => m.to.x === x && m.to.y === y);
  if (group.length === 1) tryMove(group[0]);
  else if (group.length > 1) showChooser(group, x, y);
  else hideChooser();
});

// ダブルタップ・ピンチによるズームを防ぐ
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

el('btnUndo').addEventListener('click', undo);
el('btnReset').addEventListener('click', () => {
  if (game.testing) startLevel(game.testing.stage); else loadStage(game.stageIndex);
});
el('btnPrev').addEventListener('click', () => { if (game.testing) showEditor(); else loadStage(game.stageIndex - 1); });
el('btnNext').addEventListener('click', () => loadStage(game.stageIndex + 1));
el('stageSelect').addEventListener('change', e => { loadStage(+e.target.value); e.target.blur(); });
el('btnNextOverlay').addEventListener('click', () => { if (game.testing) showEditor(); else loadStage(game.stageIndex + 1); });
el('btnToEditor').addEventListener('click', () => {
  if (!game.testing) {
    const st = game.stages[game.stageIndex];
    editor.loadStage(st, st.custom ? st.customIndex : null);
  }
  showEditor();
});
window.addEventListener('keydown', e => {
  if (!el('playView').classList.contains('active') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'z' || e.key === 'Backspace') undo();
  if (e.key === 'r') el('btnReset').click();
});
window.addEventListener('resize', () => { resize(); editor.resize(); });

/* =========================================================
 * ステージエディタ
 * ========================================================= */
// 地形のツールは置き換え、ギミックのツールは重ねる（同じものをもう一度置くと外れる）
const PALETTE = [
  'wall', 'floor', 'footA', 'footB', 'goal', 'goalA', 'goalB',
  'triTL', 'triTR', 'triBL', 'triBR', 'item', 'crumble', 'paint',
  'peakU', 'peakD', 'peakR', 'peakL', 'switch', 'doorClosed', 'doorOpen',
];
const newCell = (terrain = 'floor') => ({ terrain, mods: [] });

const editor = {
  w: 7, h: 9,
  grid: [],            // タイル種別キーの2次元配列
  a: null, b: null,    // 足の初期位置
  tool: 'floor',
  name: '',
  customIndex: null,   // 自作ステージを編集中ならその番号
  undoStack: [],
  layout: null,
  painting: false,
  lastCell: null,

  blank(w = 7, h = 9) {
    this.w = w; this.h = h;
    this.grid = [];
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) row.push(newCell(x === 0 || y === 0 || x === w - 1 || y === h - 1 ? 'wall' : 'floor'));
      this.grid.push(row);
    }
    this.a = { x: 1, y: 1 }; this.b = { x: 2, y: 1 };
    this.name = ''; this.customIndex = null; this.undoStack = [];
  },

  loadStage(stage, customIndex = null) {
    const { grid, w, h } = tokenizeStage(stage.map);
    this.w = w; this.h = h;
    this.grid = []; this.a = null; this.b = null;
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) {
        const t = grid[y][x];
        if (t.a) this.a = { x, y };
        if (t.b) this.b = { x, y };
        row.push({ terrain: t.terrain, mods: t.mods.slice() });
      }
      this.grid.push(row);
    }
    this.name = stage.name || '';
    this.customIndex = customIndex;
    this.undoStack = [];
    this.sync();
  },

  toStage() {
    const map = [];
    for (let y = 0; y < this.h; y++) {
      let line = '';
      for (let x = 0; x < this.w; x++) {
        const c = this.grid[y][x];
        line += cellToText({
          terrain: c.terrain, mods: c.mods,
          a: !!this.a && this.a.x === x && this.a.y === y,
          b: !!this.b && this.b.x === x && this.b.y === y,
        });
      }
      map.push(line);
    }
    return { name: this.name.trim(), map };
  },

  snapshot() {
    this.undoStack.push(JSON.stringify({ w: this.w, h: this.h, grid: this.grid, a: this.a, b: this.b }));
    if (this.undoStack.length > 100) this.undoStack.shift();
  },
  undo() {
    const s = this.undoStack.pop();
    if (!s) return;
    Object.assign(this, JSON.parse(s));
    this.sync();
  },

  resizeGrid(dw, dh) {
    const nw = Math.min(20, Math.max(3, this.w + dw)), nh = Math.min(24, Math.max(3, this.h + dh));
    if (nw === this.w && nh === this.h) return;
    this.snapshot();
    const ng = [];
    for (let y = 0; y < nh; y++) {
      const row = [];
      for (let x = 0; x < nw; x++) row.push(y < this.h && x < this.w ? this.grid[y][x] : newCell('wall'));
      ng.push(row);
    }
    this.grid = ng; this.w = nw; this.h = nh;
    if (this.a && (this.a.x >= nw || this.a.y >= nh)) this.a = null;
    if (this.b && (this.b.x >= nw || this.b.y >= nh)) this.b = null;
    this.sync();
  },

  /** なぞり始めのマスで「重ねる」か「外す」かを決める（ギミックのツールのとき） */
  beginStroke(x, y) {
    this.strokeMode = 'add';
    const t = this.tool;
    if (GIMMICKS[t] && x >= 0 && y >= 0 && x < this.w && y < this.h && this.grid[y][x].mods.includes(t)) this.strokeMode = 'remove';
  },

  applyTool(x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const t = this.tool;
    const cell = this.grid[y][x];
    if (t === 'footA' || t === 'footB') {
      const key = t === 'footA' ? 'a' : 'b', other = t === 'footA' ? 'b' : 'a';
      if (this[other] && this[other].x === x && this[other].y === y) this[other] = null;
      this[key] = { x, y };
      if (cell.terrain !== 'floor') { cell.terrain = 'floor'; cell.mods = []; }
    } else if (GIMMICKS[t]) {
      // ギミックは床の上に重ねる。同じ種類（ゴール同士・扉同士）は入れ替え
      if (this.strokeMode === 'remove') { cell.mods = cell.mods.filter(m => m !== t); return; }
      if (cell.terrain !== 'floor') { cell.terrain = 'floor'; cell.mods = []; }
      cell.mods = cell.mods.filter(m => GIMMICKS[m].group !== GIMMICKS[t].group);
      cell.mods.push(t);
    } else {
      // 地形は置き換え。「床」はギミックも消す（消しゴム）
      cell.terrain = t;
      cell.mods = [];
      if (t !== 'floor') for (const k of ['a', 'b']) if (this[k] && this[k].x === x && this[k].y === y) this[k] = null;
    }
  },

  sync() {
    el('edW').textContent = this.w;
    el('edH').textContent = this.h;
    el('edName').value = this.name;
    el('btnEdDelete').disabled = this.customIndex === null;
    this.resize();
  },

  resize() {
    if (!el('editView').classList.contains('active')) return;
    this.layout = fitCanvas(el('edCanvas'), el('edWrap'), this.w, this.h);
    this.draw();
  },

  draw() {
    const L = this.layout;
    if (!L) return;
    const g = L.g, c = L.cell;
    g.clearRect(0, 0, L.w, L.h);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const cell = this.grid[y][x];
      drawCell(g, staticView(cell.terrain, cell.mods), x * c, y * c, c, { wallMode: 'always' });
    }
    // グリッド線
    g.strokeStyle = 'rgba(255,255,255,0.08)';
    g.lineWidth = 1;
    for (let x = 0; x <= this.w; x++) { g.beginPath(); g.moveTo(x * c + 0.5, 0); g.lineTo(x * c + 0.5, L.h); g.stroke(); }
    for (let y = 0; y <= this.h; y++) { g.beginPath(); g.moveTo(0, y * c + 0.5); g.lineTo(L.w, y * c + 0.5); g.stroke(); }
    if (this.a && this.b && Math.abs(this.a.x - this.b.x) + Math.abs(this.a.y - this.b.y) === 1) {
      g.strokeStyle = COLORS.leg; g.lineWidth = c * 0.14; g.lineCap = 'round';
      g.beginPath(); g.moveTo((this.a.x + 0.5) * c, (this.a.y + 0.5) * c); g.lineTo((this.b.x + 0.5) * c, (this.b.y + 0.5) * c); g.stroke();
    }
    if (this.a) drawFoot(g, (this.a.x + 0.5) * c, (this.a.y + 0.5) * c, c, COLORS.footA);
    if (this.b) drawFoot(g, (this.b.x + 0.5) * c, (this.b.y + 0.5) * c, c, COLORS.footB);
  },

  status(msg, cls = '') {
    const s = el('edStatus');
    s.textContent = msg;
    s.className = cls;
  },

  check() {
    try {
      const level = parseStage(this.toStage());
      const r = solve(level);
      this.status(describeSolve(r), r.moves >= 0 && r.routes === 1 ? 'ok' : 'ng');
      return { level, r };
    } catch (e) {
      this.status(e.message, 'ng');
      return null;
    }
  },
};

function buildPalette() {
  const pal = el('palette');
  pal.innerHTML = '';
  for (const key of PALETTE) {
    const div = document.createElement('button');
    div.className = 'tool' + (editor.tool === key ? ' sel' : '');
    const cv = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    cv.width = 30 * dpr; cv.height = 30 * dpr;
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    let label;
    if (key === 'footA' || key === 'footB') {
      drawCell(g, staticView('floor'), 0, 0, 30);
      drawFoot(g, 15, 15, 30, key === 'footA' ? COLORS.footA : COLORS.footB);
      label = key === 'footA' ? '足A' : '足B';
    } else {
      const v = TERRAINS[key] ? staticView(key) : staticView('floor', [key]);
      drawCell(g, v, 0, 0, 30, { wallMode: 'always' });
      label = (TERRAINS[key] || GIMMICKS[key]).label;
    }
    div.appendChild(cv);
    const span = document.createElement('span');
    span.textContent = label;
    div.appendChild(span);
    div.addEventListener('click', () => {
      editor.tool = key;
      buildPalette();
    });
    pal.appendChild(div);
  }
}

function refreshOpenList() {
  const sel = el('edOpen');
  sel.innerHTML = '';
  const head = document.createElement('option');
  head.textContent = 'ステージを開く…';
  head.value = '';
  sel.appendChild(head);
  allStages().forEach((st, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${st.custom ? '★' : ''}${i + 1}. ${st.name || '(名前なし)'}`;
    sel.appendChild(o);
  });
}

function showEditor() {
  el('playView').classList.remove('active');
  el('editView').classList.add('active');
  hideChooser();
  refreshOpenList();
  buildPalette();
  editor.sync();
}
function showPlay() {
  el('editView').classList.remove('active');
  el('playView').classList.add('active');
  resize();
}

/* ---------- エディタの入力 ---------- */
const edCanvas = el('edCanvas');
function edCell(ev) {
  const rect = edCanvas.getBoundingClientRect();
  return { x: Math.floor((ev.clientX - rect.left) / editor.layout.cell), y: Math.floor((ev.clientY - rect.top) / editor.layout.cell) };
}
edCanvas.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  edCanvas.setPointerCapture(ev.pointerId);
  editor.snapshot();
  editor.painting = true;
  const p = edCell(ev);
  editor.beginStroke(p.x, p.y);
  editor.lastCell = p.x + ',' + p.y;
  editor.applyTool(p.x, p.y);
  editor.draw();
});
edCanvas.addEventListener('pointermove', ev => {
  if (!editor.painting) return;
  const p = edCell(ev);
  const k = p.x + ',' + p.y;
  if (k === editor.lastCell) return;
  editor.lastCell = k;
  if (editor.tool === 'footA' || editor.tool === 'footB') return; // 足はなぞらない
  editor.applyTool(p.x, p.y);
  editor.draw();
});
const endPaint = () => { editor.painting = false; editor.lastCell = null; };
edCanvas.addEventListener('pointerup', endPaint);
edCanvas.addEventListener('pointercancel', endPaint);

document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
  const v = b.dataset.size;
  editor.resizeGrid(v === 'w+' ? 1 : v === 'w-' ? -1 : 0, v === 'h+' ? 1 : v === 'h-' ? -1 : 0);
}));
el('edName').addEventListener('input', e => { editor.name = e.target.value; });
el('edOpen').addEventListener('change', e => {
  if (e.target.value === '') return;
  const st = allStages()[+e.target.value];
  editor.loadStage(st, st.custom ? st.customIndex : null);
  editor.status(`「${st.name || '名前なし'}」を開きました${st.custom ? '' : '（保存すると自作ステージとして追加されます）'}`);
  e.target.value = '';
});
el('btnEdNew').addEventListener('click', () => { editor.blank(); editor.sync(); editor.status('新しいステージ'); });
el('btnEdUndo').addEventListener('click', () => editor.undo());
el('btnEdClear').addEventListener('click', () => {
  editor.snapshot();
  const keep = { name: editor.name, customIndex: editor.customIndex, undo: editor.undoStack };
  editor.blank(editor.w, editor.h);
  editor.name = keep.name; editor.customIndex = keep.customIndex; editor.undoStack = keep.undo;
  editor.sync();
});
el('btnEdCheck').addEventListener('click', () => editor.check());
el('btnEdTest').addEventListener('click', () => {
  const res = editor.check();
  if (!res) return;
  const stage = editor.toStage();
  game.testing = { stage };
  showPlay();
  startLevel(stage);
  game.testing = { stage }; // startLevel 後も保持
  updateHud();
});
el('btnEdSave').addEventListener('click', () => {
  const stage = editor.toStage();
  try { parseStage(stage); } catch (e) { editor.status('保存できません: ' + e.message, 'ng'); return; }
  if (!stage.name) stage.name = `自作${customStages.length + 1}`;
  if (editor.customIndex === null) { customStages.push(stage); editor.customIndex = customStages.length - 1; }
  else customStages[editor.customIndex] = stage;
  editor.name = stage.name;
  const ok = saveCustomStages(customStages);
  editor.sync();
  refreshOpenList();
  editor.status(ok ? `保存しました（★${STAGES.length + editor.customIndex + 1}）。プレイ画面のステージ一覧の最後に入ります` : 'このブラウザでは保存できませんでした。書き出しでコピーしてください', ok ? 'ok' : 'ng');
});
el('btnEdDelete').addEventListener('click', () => {
  if (editor.customIndex === null) return;
  if (!confirm('この自作ステージを削除しますか？')) return;
  customStages.splice(editor.customIndex, 1);
  saveCustomStages(customStages);
  editor.customIndex = null;
  editor.sync();
  refreshOpenList();
  editor.status('削除しました');
});

/* ---------- 書き出し / 読み込み ---------- */
let modalHandler = null;
function openModal(title, note, text, okLabel, handler) {
  el('modalTitle').textContent = title;
  el('modalNote').textContent = note;
  el('modalText').value = text;
  el('modalOk').textContent = okLabel;
  modalHandler = handler;
  el('modal').classList.add('show');
}
el('modalCancel').addEventListener('click', () => el('modal').classList.remove('show'));
el('modalOk').addEventListener('click', () => { if (modalHandler && modalHandler(el('modalText').value) !== false) el('modal').classList.remove('show'); });

function stageToCode(stage) {
  const esc = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  return `  { name: '${esc(stage.name || '')}', map: [\n${stage.map.map(r => `    '${esc(r)}',`).join('\n')}\n  ]},`;
}
/** 貼り付けたテキストからステージを読み取る（コード片・JSON・マップの行そのまま、のどれでも可） */
function parseStageText(text) {
  const nameMatch = text.match(/name\s*:\s*(['"])((?:\\.|(?!\1).)*)\1/);
  const body = text.replace(/name\s*:\s*(['"])((?:\\.|(?!\1).)*)\1/, '');
  const strs = [...body.matchAll(/(['"])((?:\\.|(?!\1).)*)\1/g)].map(m => m[2].replace(/\\(.)/g, '$1')).filter(s => s.length && s !== 'map');
  let map = strs;
  if (!map.length) map = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  return { name: nameMatch ? nameMatch[2] : '', map };
}
el('btnEdExport').addEventListener('click', () => {
  const code = stageToCode(editor.toStage());
  openModal('書き出し', 'このテキストを index.html の STAGES 配列に貼り付けると組み込みステージになります', code, 'コピー', text => {
    const ta = el('modalText');
    ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { /* noop */ }
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    editor.status(done || navigator.clipboard ? 'コピーしました' : 'テキストを選択してコピーしてください');
  });
});
el('btnEdImport').addEventListener('click', () => {
  openModal('読み込み', '書き出したテキスト、またはマップの行（# . A B など）を貼り付けてください', '', '読み込む', text => {
    const st = parseStageText(text);
    if (!st.map.length) { alert('マップが見つかりません'); return false; }
    try { tokenizeStage(st.map); } catch (err) { alert(err.message); return false; }
    editor.snapshot();
    const undo = editor.undoStack;
    editor.loadStage(st, null);
    editor.undoStack = undo;
    editor.status('読み込みました');
  });
});
el('btnEdToPlay').addEventListener('click', () => {
  showPlay();
  loadStage(game.testing ? 0 : Math.min(game.stageIndex, allStages().length - 1));
});

/* =========================================================
 * 起動
 * ========================================================= */
function verifyAllStages() {
  const results = [];
  STAGES.forEach((st, i) => {
    let r;
    try {
      r = solve(parseStage(st));
    } catch (e) {
      console.warn(`ステージ${i + 1}: 読み込みエラー - ${e.message}`);
      results.push(null);
      return;
    }
    if (r.moves < 0) {
      console.warn(`ステージ${i + 1}: ${r.truncated ? '探索の上限に達しました（解けるか不明）' : '解けません！'}`);
    } else {
      console.log(`ステージ${i + 1}: 最短${r.moves}手`);
      if (r.routes > 1) console.warn(`ステージ${i + 1}: 最短ルートが${r.routes === Infinity ? '多数' : r.routes + '通り'}あります`);
    }
    results.push(r);
  });
  return results;
}

verifyAllStages();
editor.blank();
loadStage(0);
showEditor(); // このブランチはエディタから始まる
</script>
